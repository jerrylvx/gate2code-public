name: Quick verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-quick.txt
      - name: Install the tested quick-check environment
        run: python -m pip install -c requirements-quick.txt -e .
      - name: Check the installation
        run: python -m pip check
      - name: Verify stored witnesses
        run: python scripts/verify_quick.py --report .quick-check/verification.json
      - name: Confirm archived reports were preserved
        if: always()
        run: git diff --exit-code -- reports/
      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quick-verification
          path: .quick-check/verification.json
          if-no-files-found: warn
